services:
  mysql:
    image: mysql:8.0
    container_name: fp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: olympic_dataset
      MYSQL_USER: de
      MYSQL_PASSWORD: de_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: fp-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  spark:
    build: ./docker/spark
    container_name: fp-spark
    working_dir: /opt/project
    command: sleep infinity
    environment:
      MYSQL_HOST: mysql
      MYSQL_DB: olympic_dataset
      MYSQL_USER: de
      MYSQL_PASSWORD: de_pass
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - .:/opt/project
      - ivy_cache:/root/.ivy2
    ports:
      - "4040:4040"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

  airflow:
    build: ./docker/airflow
    container_name: fp-airflow
    user: "${AIRFLOW_UID:-1000}:0"   # файли в datalake/ створюються від твого юзера
    command: >
      bash -c "airflow db migrate &&
      (airflow connections add spark-default --conn-type spark --conn-host 'local[*]' || true) &&
      exec airflow standalone"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/part2_batch
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      DATALAKE_DIR: /opt/project/datalake
    volumes:
      - .:/opt/project
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  ivy_cache:
